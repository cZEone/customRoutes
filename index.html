<style>
/* Layout: one column of route cards, sorted by arrival; cobalt header, arrival times on tinted plates. */
:root {
  --bg: #F6F7FB; --card: #FFFFFF; --ink: #0F1430; --muted: #5B6180; --line: #DFE2EE;
  --hdr: #2340D9; --hdr-ink: #FFFFFF; --hdr-dim: rgba(255,255,255,.72); --hdr-line: rgba(255,255,255,.35);
  --plate: #EEF1FF; --led: #2340D9; --plate-ink: #5B6180; --accent: #2340D9;
  --ok: #16794A; --ok-bg: #E0F3E8; --warn: #A35A00; --warn-bg: #FCEBD3; --bad: #C02B24; --bad-bg: #FCE2E0;
  --f-display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0B0E1C; --card: #141933; --ink: #E8EAF6; --muted: #9AA0C0; --line: #262C4D;
    --hdr: #18267A; --hdr-ink: #FFFFFF; --hdr-dim: rgba(255,255,255,.7); --hdr-line: rgba(255,255,255,.3);
    --plate: #1C2350; --led: #9DB0FF; --plate-ink: #9AA0C0; --accent: #7D93FF;
    --ok: #5ECD8F; --ok-bg: #11301F; --warn: #F0B04A; --warn-bg: #33260F; --bad: #F47C74; --bad-bg: #3A1A18;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0B0E1C; --card: #141933; --ink: #E8EAF6; --muted: #9AA0C0; --line: #262C4D;
  --hdr: #18267A; --hdr-ink: #FFFFFF; --hdr-dim: rgba(255,255,255,.7); --hdr-line: rgba(255,255,255,.3);
  --plate: #1C2350; --led: #9DB0FF; --plate-ink: #9AA0C0; --accent: #7D93FF;
  --ok: #5ECD8F; --ok-bg: #11301F; --warn: #F0B04A; --warn-bg: #33260F; --bad: #F47C74; --bad-bg: #3A1A18;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink); font: 15px/1.45 var(--f-body);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  -webkit-text-size-adjust: 100%;
}
.wrap { max-width: 640px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header { position: sticky; top: 0; z-index: 5; background: var(--hdr); color: var(--hdr-ink); padding-top: env(safe-area-inset-top, 0px); }
header .wrap { padding-block: 12px 0; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.logo { width: 34px; height: 34px; flex: none; border-radius: 9px; box-shadow: 0 0 0 1.5px var(--hdr-line); }
h1 { font: 700 26px/1 var(--f-display); letter-spacing: .01em; margin: 0; }
h1 small { display: block; font: 400 12px/1.2 var(--f-body); color: var(--hdr-dim); margin-top: 2px; letter-spacing: 0; }
.status { font-size: 12px; color: var(--hdr-dim); text-align: right; font-variant-numeric: tabular-nums; }
.status button { font: 700 12px var(--f-body); color: var(--hdr); background: var(--hdr-ink); border: 0; border-radius: 99px; padding: 5px 11px; margin-left: 6px; cursor: pointer; }
nav { display: flex; gap: 2px; margin-top: 12px; overflow-x: auto; scrollbar-width: none; }
nav button {
  flex: 1 0 auto; font: 600 17px/1 var(--f-display); letter-spacing: .04em; text-transform: uppercase;
  color: var(--hdr-dim); background: none; border: 0; border-bottom: 3px solid transparent; padding: 10px 12px 9px; cursor: pointer;
}
nav button[aria-selected="true"] { color: var(--hdr-ink); border-bottom-color: var(--hdr-ink); }
nav button:focus-visible, button:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
header button:focus-visible { outline-color: var(--hdr-ink); }
main .wrap { padding-block: 14px 40px; display: flex; flex-direction: column; gap: 12px; }
.from { font-size: 13px; color: var(--muted); }
.here { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 13px; color: var(--muted); }
.here span { font-weight: 700; color: var(--ink); }
.here button { font: 700 13px var(--f-body); padding: 7px 11px; border-radius: 99px; border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; }
.here button.cur { background: var(--accent); border-color: var(--accent); color: var(--card); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.card.best { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.rname { font: 600 19px/1.1 var(--f-display); letter-spacing: .02em; }
.rname small { display: block; font: 400 12px/1.3 var(--f-body); color: var(--muted); margin-top: 3px; letter-spacing: 0; }
.plate { background: var(--plate); color: var(--led); border-radius: 8px; padding: 6px 10px; text-align: right; min-width: 86px; font-variant-numeric: tabular-nums; }
.plate b { display: block; font: 700 26px/1 var(--f-display); letter-spacing: .03em; }
.plate span { font-size: 11px; color: var(--plate-ink); white-space: nowrap; }
.summary { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.pill { font-size: 12.5px; font-weight: 700; padding: 3px 9px; border-radius: 99px; background: var(--bg); color: var(--ink); white-space: nowrap; }
.pill.ok { background: var(--ok-bg); color: var(--ok); }
.pill.warn { background: var(--warn-bg); color: var(--warn); }
.pill.bad { background: var(--bad-bg); color: var(--bad); }
ol.steps { list-style: none; margin: 0; padding: 0 0 0 14px; border-left: 2px solid var(--line); display: flex; flex-direction: column; gap: 7px; }
ol.steps li { position: relative; font-size: 14px; min-width: 0; }
ol.steps li::before { content: ""; position: absolute; left: -20px; top: 6px; width: 10px; height: 10px; border-radius: 50%; background: var(--card); border: 2px solid var(--muted); }
ol.steps li.bus::before { border-color: var(--accent); background: var(--accent); }
ol.steps li.xfer.ok::before { border-color: var(--ok); background: var(--ok); }
ol.steps li.xfer.warn::before { border-color: var(--warn); background: var(--warn); }
ol.steps li.xfer.bad::before { border-color: var(--bad); background: var(--bad); }
.svc { display: inline-block; font: 700 14px/1 var(--f-display); background: var(--accent); color: var(--card); padding: 3px 6px 2px; border-radius: 4px; letter-spacing: .03em; }
.t { font-variant-numeric: tabular-nums; font-weight: 700; }
.meta { color: var(--muted); font-size: 12.5px; }
.tag { font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; padding: 1px 5px; border-radius: 4px; border: 1px solid var(--line); color: var(--muted); }
.tag.gps { color: var(--ok); border-color: currentColor; }
.tag.sched { color: var(--warn); border-color: currentColor; }
details { border-top: 1px solid var(--line); padding-top: 8px; }
summary { cursor: pointer; font-size: 13px; color: var(--accent); font-weight: 700; }
table.later { width: 100%; border-collapse: collapse; margin-top: 6px; font-size: 13.5px; font-variant-numeric: tabular-nums; }
table.later td { padding: 5px 4px; border-bottom: 1px solid var(--line); }
table.later td:last-child { text-align: right; }
.empty { color: var(--muted); font-size: 14px; }
.legend { font-size: 12.5px; color: var(--muted); display: flex; flex-direction: column; gap: 4px; padding: 4px 2px; }
.err { background: var(--bad-bg); color: var(--bad); border-radius: 10px; padding: 10px 12px; font-size: 13.5px; }
/* Times editor */
.edit h2 { font: 600 20px/1.1 var(--f-display); text-transform: uppercase; letter-spacing: .03em; margin: 6px 0 0; }
.edit h3 { font: 600 16px/1.2 var(--f-display); margin: 4px 0 0; letter-spacing: .02em; }
.row { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--line); }
.row label { font-size: 14px; min-width: 0; }
.row label .meta { display: block; }
.row input { width: 64px; font: 700 16px var(--f-body); padding: 6px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); text-align: right; }
.row input.changed { border-color: var(--accent); }
.guess { color: var(--warn); font-weight: 700; }
.btn { font: 700 14px var(--f-body); padding: 9px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--card); }
.btn:disabled { opacity: .45; cursor: default; }
.acts { display: flex; flex-wrap: wrap; gap: 8px; }
.acts.small .btn { font-size: 13px; padding: 7px 12px; }
.btn.go { padding: 7px 18px; }
.acts .btn.go { flex: 1; padding: 10px 18px; font-size: 15px; background: var(--accent); border-color: var(--accent); color: var(--card); }
table.later .btn.go { padding: 5px 12px; font-size: 13px; }
table.later tr.early td:first-child { color: var(--warn); font-weight: 700; }
/* Trip mode */
.card.trip { border: 2px solid var(--accent); }
.progress { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 4px; }
.progress button { font: 600 13px/1 var(--f-display); letter-spacing: .03em; text-transform: uppercase; padding: 7px 9px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--muted); cursor: pointer; }
.progress button.done { background: var(--ok-bg); color: var(--ok); border-color: transparent; }
.progress button.done::before { content: "✓ "; }
.progress button.cur { background: var(--accent); color: var(--card); border-color: var(--accent); }
.now { font-size: 15.5px; display: flex; flex-direction: column; gap: 6px; }
.now b { font-size: 17px; }
.ask { background: var(--bg); border-radius: 10px; padding: 10px 12px; font-size: 14px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.alert { border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 8px; font-size: 14.5px; border: 2px solid currentColor; }
.alert.bad { background: var(--bad-bg); color: var(--bad); }
.alert.warn { background: var(--warn-bg); color: var(--warn); }
.alert b { font: 700 18px/1 var(--f-display); text-transform: uppercase; letter-spacing: .04em; }
.alert span { color: var(--ink); }
.tripbar { font: 700 14px var(--f-body); text-align: left; padding: 12px 14px; border-radius: 10px; border: 2px solid var(--accent); background: var(--card); color: var(--accent); cursor: pointer; }
@media (prefers-reduced-motion: no-preference) {
  .card { transition: border-color .2s; }
  .alert { animation: flash .6s ease-in-out 5; }
  @keyframes flash { 50% { box-shadow: 0 0 0 6px currentColor; } }
}
</style>
</head>

/* ============================ Rendering ============================ */
const $ = s => document.querySelector(s);

function renderTabs() {

/* Tabs that start from a place you walk out of (home, school) show a leave time. */
const leaveWord = tab => tab.leaveWord || (tab.from.startsWith("From home") ? "" : null);

/* Where you are right now, per tab: "" = the usual start (home, school, MRT), or a first-boarding stop code.

let here = { tab: null, stop: "", at: 0 };
const hereStop = tab => here.tab === tab.id && here.stop && Date.now() - here.at < 30 * 60000 ? here.stop : "";

function hereHtml(tab) {

const lastPlans = {};   // tab -> route index -> journeys, as last shown (for the Go buttons)
const STAGE_CHIP = (st, legs) => st.k === "done" ? "Arrive" : st.k === "wait" ? "Wait" : st.k === "ride" ? legs[st.i].svc.join("/") : legs[st.i].t === "train" ? "MRT" : "Walk";

  const { S, st, proj, rem } = T, legs = trip.legs, tab = TABS.find(t => t.id === trip.tab);

/* ============================ Refresh loop ============================ */
let lastFetch = 0, fetching = false;
async function refresh() {

  const stops = new Set();
  [current, trip && trip.tab].forEach(id => { const t = TABS.find(x => x.id === id); if (t) stopsFor(t).forEach(s => stops.add(s)); });
  if (trip) trip.legs.forEach(l => { if (l.t === "bus") { stops.add(l.from); stops.add(l.to); } });

$("#tabs").addEventListener("click", e => {

});

$("#view").addEventListener("change", e => {
  const i = e.target.closest("input[data-key]"); if (!i) return;
  const v = Number(i.value);
  if (!Number.isFinite(v) || v < 0) return;
  if (v === Number(i.dataset.def)) delete overrides[i.dataset.key]; else overrides[i.dataset.key] = v;

  if (e.target.id === "reset") { overrides = {}; store.set("bus.overrides", overrides); renderTimes(); return; }

  if (g) { const [t, ri, k] = g.dataset.go.split("|"); startTrip(t, +ri, +k); return; }

    case "leave": trip.stageAt = Date.now(); break;
    case "jump": jumpTo(+a.dataset.stage); break;
    case "undo": undoJump(); break;
    case "pick": if (trip.picks && trip.picks[+a.dataset.i]) { trip.ride = { ...trip.picks[+a.dataset.i], seen: Date.now() }; } break;

    case "back": backStep(); break;
    case "yes": trip.ask = null; break;
    case "missed": missedBus(); break;
